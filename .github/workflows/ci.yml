name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Non-blocking for now: 17 pre-existing errors in components/ui/motion-wrapper.tsx,
      # components/easter-eggs/, components/navbar/BottomNav.tsx and the command
      # palette predate this workflow. Flip to a hard failure once they're cleared.
      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Typecheck
        run: bun run typecheck

      # Also the frontmatter gate: lib/blog.ts throws on a malformed post,
      # so a bad `date` fails here instead of silently corrupting the feed.
      - name: Build
        run: bun run build
